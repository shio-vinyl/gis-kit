# conda-forge 环境；适合 pip 安装 GDAL 相关 wheel 有困难的平台。
#   conda env create -f environment.yml && conda activate gis-kit
name: gis-kit
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy>=2.2
  - shapely>=2.1
  - geopandas>=1.1
  - pyogrio>=0.12
  - pyproj>=3.7
  - pandas>=2.3
  - rasterio>=1.4
  - matplotlib-base>=3.9
  - pillow>=11.3
  - pyyaml>=6.0
  - scipy>=1.13
  - scikit-learn>=1.6
  - scikit-image>=0.24
  - py-opencv>=4.12
  - networkx>=3.4
  - pyarrow>=21.0
  - openpyxl>=3.1
  - tabulate>=0.9
  - pytest>=8.4
  - fonts-conda-forge
