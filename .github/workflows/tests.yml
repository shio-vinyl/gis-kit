name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements-tested.txt
          python -m pip check
      - name: Environment report
        run: python scripts/daily.py environment
      - name: Unit tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/mpl
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: python -m pytest -q -p no:cacheprovider tests
